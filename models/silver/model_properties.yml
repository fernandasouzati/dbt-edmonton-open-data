models:
- name: stg_fct_311_requests
  columns:
    - name: request_id
      tests:
        - not_null
        - unique
    - name: request_status
      tests:
        - not_null
        - accepted_values:
            values: [Open, Closed]
    - name: service_description
      tests:
        - check_foreign_key:
            dim_table_name: silver.stg_dim_service
            dim_id: service_description
- name: stg_dim_service
  columns:
    - name: service_description
      tests:
        - not_null
        - unique
