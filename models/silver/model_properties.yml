models:
- name: stg_fct_311_requests
  columns:
    - name: request_id
      tests:
        - not_null
        - unique
    - name: request_status
      tests:
        - not_null
        - accepted_values:
            values: [Open, Closed]
    - name: date_created
      tests:
        - check_foreign_key:
            arguments:
              dim_table_name: silver.stg_dim_date
              dim_id: date_day
- name: stg_dim_service
  columns:
    - name: service_combined
      tests:
        - not_null
        - unique
